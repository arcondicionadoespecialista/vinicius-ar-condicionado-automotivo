<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Snowflake & Air Vent Wave Centerpiece -->
  <g transform="translate(256, 236)" stroke="url(#snowGrad)" stroke-width="16" stroke-linecap="round">
    <!-- Vertical line -->
    <line x1="0" y1="-110" x2="0" y2="110" />
    <!-- Horizontal line -->
    <line x1="-110" y1="0" x2="110" y2="0" />
    <!-- Diagonal 1 -->
    <line x1="-78" y1="-78" x2="78" y2="78" />
    <!-- Diagonal 2 -->
    <line x1="-78" y1="78" x2="78" y2="-78" />
    <!-- Snowflake branches -->
    <path d="M0,-80 L-25,-100 M0,-80 L25,-100" />
    <path d="M0,80 L-25,100 M0,80 L25,100" />
    <path d="M-80,0 L-100,-25 M-80,0 L-100,25" />
    <path d="M80,0 L100,-25 M80,0 L100,25" />
    <path d="M-55,-55 L-80,-55 M-55,-55 L-55,-80" />
    <path d="M55,-55 L80,-55 M55,-55 L55,-80" />
    <path d="M-55,55 L-80,55 M-55,55 L-55,80" />
    <path d="M55,55 L80,55 M55,55 L55,80" />
  </g>
  <!-- Cooling Waves / Air Flow under -->
  <path d="M 120 390 Q 200 370 256 390 T 392 390" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.9" />
  <path d="M 150 425 Q 210 405 256 425 T 362 425" fill="none" stroke="#7dd3fc" stroke-width="10" stroke-linecap="round" opacity="0.7" />
</svg>
