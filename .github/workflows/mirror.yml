name: Mirror to Vinicius repo

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout despachante repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_DEPLOY_KEY }}

      - name: Trust github.com host key
        run: mkdir -p ~/.ssh && ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Push mirror to Vinicius' own repository
        run: |
          git remote add vinicius git@github.com:arcondicionadoespecialista/vinicius-ar-condicionado-automotivo.git
          git push vinicius HEAD:main --force
